<!-- Top content -->
<div class="container-center pt-4" *ngIf="weatherData">
  <div class="weather-box p-4 shadow-sm bg-light rounded">

    <h3 class="text-center mb-4">Current Weather in {{ city }}</h3>

    <div class="text-center mb-3">
      <img [src]="'https://openweathermap.org/img/wn/' + weatherData.weather[0].icon + '@2x.png'" alt="Weather icon">
    </div>

    <table class="table table-bordered text-center">
      <thead class="table-light">
        <tr>
          <th>Date (mm/dd/yyyy)</th>
          <th>Temp (F)</th>
          <th>Description</th>
          <th>Main</th>
          <th>Pressure</th>
          <th>Humidity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{ getCurrentDate() }}</td>
          <td>{{ toFahrenheit(weatherData.main.temp) }}</td>
          <td>{{ weatherData.weather[0].description }}</td>
          <td>{{ weatherData.weather[0].main }}</td>
          <td>{{ weatherData.main.pressure }}</td>
          <td>{{ weatherData.main.humidity }}</td>
        </tr>
      </tbody>
    </table>

  </div>
</div>

<div class="d-flex flex-column min-vh-100 position-relative">

  <!-- Weather content (still conditional) -->

  <!-- Back button always visible bottom-right -->
  <button class="btn btn-outline-secondary back-button" (click)="goBack()">Back</button>
</div>
