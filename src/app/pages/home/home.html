<div class="home-wrapper" *ngIf="auth.user$ | async as user">
  <h2>Welcome, {{ user.name }}</h2>
  
  <p>
    <a [href]="'https://github.com/' + user.nickname" target="_blank">
      https://github.com/{{ user.nickname }}
    </a>
  </p>

  <input
    type="text"
    class="form-control w-50"
    placeholder="City"
    [(ngModel)]="city"
  />

  <button class="btn btn-primary mt-3" (click)="displayWeather()">
    Display Weather
  </button>
</div>
